<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEROS - Amiga 1994 (version navigateur)</title>
<style>
:root{--bg:#120c08;--panel:#1a120c;--clair:#f0d9a8;--or:#ffd070;--bord:#5a4126;--btn:#3a2a1a;--btnh:#5a4126;--ui:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--clair);font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{display:flex;height:100vh;height:100dvh;width:100%}
#colText{flex:1 1 auto;min-width:0;overflow:auto;background:#000;position:relative;display:flex;flex-direction:column;align-items:flex-start}
#colUi{flex:0 0 auto;width:360px;min-width:200px;background:var(--panel);overflow-y:auto;padding:calc(10px*var(--ui));font-size:calc(15px*var(--ui));border-left:2px solid var(--bord)}
#split{flex:0 0 7px;cursor:col-resize;background:var(--bord);touch-action:none}
#split:hover,#split.on{background:#9a7240}
#stage{position:relative;overflow:hidden;background:#000;margin:0 auto;flex:0 0 auto}
#decor{position:absolute;inset:0;background-size:100% auto;background-repeat:no-repeat;image-rendering:pixelated}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#9a7240 #2a1c10}
#page{position:relative;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated}
.ln{position:absolute;white-space:pre;letter-spacing:var(--ls,0);font-family:"DejaVu Sans Mono","Cascadia Mono",Consolas,Menlo,"Liberation Mono",monospace;line-height:1;height:var(--lh)}
.ln b{font-weight:700}
.ln.g{cursor:pointer}
.ln.g.hot,.ln.g.hot b{color:#ffe27a!important}
#panneau{position:absolute;border:3px solid}
#titre{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center}
#titre img{max-width:100%;max-height:100%;image-rendering:pixelated}
#titre span{position:absolute;bottom:3%;left:0;right:0;text-align:center;color:#ffe9b0;font-weight:700;text-shadow:1px 1px #000;font-size:calc(var(--lh)*1.2)}
#msg{min-height:1.6em;padding:4px 8px;color:var(--or);font-size:calc(14px*var(--ui));background:var(--panel);width:100%;position:sticky;bottom:0;border-top:1px solid var(--bord)}
h2{margin:.2em 0 .4em;font-size:1em;color:var(--or);letter-spacing:.05em}
.sec{margin-bottom:calc(12px*var(--ui))}
#objs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.ico{aspect-ratio:16/17;background:url(img/icons.png) no-repeat;image-rendering:pixelated;opacity:.28}
.ico.on{opacity:1}
#hearts{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;font-size:calc(14px*var(--ui));line-height:1}
#hearts i{font-style:normal;color:#3a2a2a;text-align:center}
#hearts i.on{color:#e03030}
#gold{display:flex;gap:6px;align-items:center}
#gold i{width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0a0,#d09a10 60%,#6a4a00);display:inline-block}
#hdr{display:flex;gap:6px;margin-bottom:8px}#hdr a{color:var(--or);text-decoration:none;border:1px solid var(--bord);padding:2px 8px;border-radius:4px;font-size:.9em}
.map{display:grid;gap:3px;margin:.4em 0}.mz{background:#2a1c10;border:1px solid var(--bord);padding:.25em .4em;text-align:center;font-size:.85em;border-radius:3px}.mz.here{background:#b03030;color:#fff;border-color:#ffd070}
.rose{margin:.3em 0;font-family:monospace;color:var(--or);line-height:1.1}
button{font:inherit;color:var(--clair);background:var(--btn);border:1px solid var(--bord);border-radius:6px;padding:.35em .7em;cursor:pointer}
button:hover:not(:disabled){background:var(--btnh)}
button:disabled{opacity:.4;cursor:default}
#choix button{display:block;width:100%;text-align:left;margin:0 0 5px;padding:.5em .7em;line-height:1.3}
#choix button b{color:var(--or);margin-right:.4em}
#cmds{display:flex;flex-wrap:wrap;gap:5px}
#cmds button{flex:1 0 auto}
.zm{display:flex;gap:5px;align-items:center;margin:4px 0}
.zm span{flex:1}
dialog{background:var(--panel);color:var(--clair);border:2px solid var(--bord);border-radius:10px;max-width:min(560px,94vw);font-size:calc(15px*var(--ui))}
dialog::backdrop{background:#000a}
dialog h3{margin:.1em 0 .6em;color:var(--or)}
.sl{display:flex;gap:6px;margin:5px 0}.sl button{flex:1;text-align:left}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
select,input[type=number],input[type=text]{font:inherit;background:#2a1c10;color:var(--clair);border:1px solid var(--bord);border-radius:5px;padding:.25em .4em}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.fin{color:var(--or);font-weight:700;margin:.4em 0}
@media (max-width:760px){#app{flex-direction:column}#colUi{width:100%!important;max-height:46vh;border-left:0;border-top:2px solid var(--bord)}#split{display:none}}
</style>
</head>

</div>

};

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return mem[k] ?? d; } },

const mem = {};

/* -------------------------------------------------------- DataHeros (decodage) */
const b64 = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
class Textes {
  constructor(u8) {
    this.d = u8; const dv = new DataView(u8.buffer);
    const debut = dv.getUint32(0); this.debut = {}; const fins = new Set();
    for (let p = 4; p < debut; p += 8) {
      let n = ''; for (let k = 0; k < 4; k++) { const c = u8[p + k]; if (c) n += String.fromCharCode(c); }

    }

  }
  brut(nom) {                      // [[col, lig, "texte latin-1"]]
    if (this.cache[nom]) return this.cache[nom];

    for (const f of this.fins) if (f > deb) { fin = f; break; }

    for (const cle of [0x55, 0xAA]) { const l = this.analyser(oct, cle); if (l) { res = l; break; } }

  }
  analyser(oct, cle) {
    const lignes = []; let i = 0; const n = oct.length;
    while (i < n) {

      if (col >= 80 || lig >= 64) return null;

      if (i < n && (oct[i] ^ cle) === 0xFF) i++;
    }
    if (!lignes.length) return null;
    let tot = 0, ok = 0;

const bit = (v, n) => (v >> n) & 1;

  for (let c of cond.split(' ET ')) {
    c = c.trim(); if (c === 'toujours') continue;
    let m = c.match(/^Flags([WL]) bit (\d+) (actif|inactif)$/);
    if (m) { const v = m[1] === 'W' ? W : L; if ((bit(v, +m[2]) === 1) !== (m[3] === 'actif')) return false; continue; }

  for (let e of eff.split(', ')) {

}
window.HerosMoteur = { SC, IDX, nouvelEtat, choisir, choixValides, LAB };

/* ------------------------------------------------------------------- son */
const Son = {
  actif: store.get('heros_son', '1') === '1', liste: null, a: null, b: null,
  jouer(n) {
    if (!this.actif) { this.demande = n; return; }
    if (n === this.liste) return;
    this.arreter(); this.liste = n;
    const L = D.lists[n], a = new Audio(`snd/l${n}a.ogg`);
    a.volume = .7; this.a = a;
    if (L.b > 0) {
      const b = new Audio(`snd/l${n}b.ogg`); b.loop = true; b.volume = .7; this.b = b;
      a.addEventListener('ended', () => { if (this.liste === n) b.play().catch(() => {}); });
    } else a.loop = true;
    a.play().catch(() => { this.liste = null; });   // bloqué avant le premier geste : on réessaiera
  },
  arreter() { for (const x of [this.a, this.b]) if (x) { x.pause(); x.src = ''; } this.a = this.b = null; this.liste = null; },
  scene(i) { this.jouer(D.scMusic[i]); },
  intro() { this.jouer(D.intro); },
  bascule() { this.actif = !this.actif; store.set('heros_son', this.actif ? '1' : '0'); if (!this.actif) this.arreter(); else if (this.demande != null) this.jouer(this.demande); return this.actif; }
};

/* ------------------------------------------------------------------ jeu */
let mode = 'titre', introN = 0, hist = [nouvelEtat()], groupes = [], sceneSortie = false;
let cwPx = 8, lhPx = 12, S = 1, zoomT = +store.get('heros_zt', '1'), zoomU = +store.get('heros_zu', '1');
let ratioFonte = 0.6, hViewport = 320;
const stage = $('stage'), page = $('page'), scroll = $('scroll');

function mesureFonte() {
  const c = document.createElement('canvas').getContext('2d');
  c.font = '100px "DejaVu Sans Mono","Cascadia Mono",Consolas,Menlo,"Liberation Mono",monospace';
  ratioFonte = c.measureText('0').width / 100 || 0.6;
}
function mettreEchelle() {
  const col = $('colText'); const dispo = col.clientWidth - 2;
  const hDispo = col.clientHeight - $('msg').offsetHeight - 2;
  // 1.0 = le parchemin occupe la largeur de la colonne (sans dépasser la hauteur de fenêtre)
  const sFit = Math.min(dispo / 608, Math.max(hDispo, 200) / 320 * 1.0);
  S = Math.max(0.3, sFit * zoomT);
  const stH = Math.max(320 * S, Math.min(hDispo, (640 - CROP) * S));
  stage.style.width = (608 * S) + 'px'; stage.style.height = stH + 'px';
  hViewport = stH; cwPx = 8 * S; lhPx = 12 * S;
  stage.style.setProperty('--lh', lhPx + 'px');
  stage.style.setProperty('--cw', cwPx + 'px');
  page.style.width = (608 * S) + 'px'; page.style.height = Math.max(640 * S, hViewport) + 'px';
  const fs = Math.min(cwPx / ratioFonte, lhPx * 0.95); stage.style.fontSize = fs + 'px';
  stage.style.setProperty('--ls', (cwPx - fs * ratioFonte) + 'px');
}
function appliquerZoomUI() {
  document.documentElement.style.setProperty('--ui', zoomU);
}
function seg(brut) {          // [[col, lig, [[dec, texte, accent]]]]
  let accent = false;
  return brut.map(([col, lig, s]) => {
    s = s.replace(/­/g, '─'); const segs = []; let dec = 0;
    for (const m of s.split(/(@\d)/)) {
      if (/^@\d$/.test(m)) accent = m[1] !== '1'; else if (m) { segs.push([dec, m, accent]); dec += m.length; }
    }
    return [col, lig, segs];
  });
}
/* alpha des parchemins : sert à décaler vers la gauche les pages dont le texte touche le bord déchiré */
const ALPHA = [];
(async () => { for (let p = 0; p < 5; p++) { try { const im = new Image(); im.src = `img/parch${p}.png`; await im.decode();
  const c = document.createElement('canvas'); c.width = 608; c.height = 640; const x = c.getContext('2d'); x.drawImage(im, 0, 0); ALPHA[p] = x.getImageData(0, 0, 608, 640).data; } catch (e) { ALPHA[p] = null; } } })();
function decalageCols(brut, p) {
  const d = ALPHA[p]; if (!d) return 0; const M = 16; let worst = 0;
  for (const [col, lig, t] of brut) {
    const n = t.replace(/@\d/g, '').length; if (!t.replace(/@\d/g, '').trim()) continue;
    const x0 = col * 8, x1 = (col + n) * 8;
    for (let y = lig * 12 + 2; y < lig * 12 + 10; y += 4) {
      if (y >= 640 || d[(y * 608 + x0) * 4 + 3] <= 128) continue;
      let r = x0; while (r < 607 && d[(y * 608 + r) * 4 + 3] > 128) r++;
      worst = Math.max(worst, x1 - (r - M));
    }
  }
  return Math.min(6, Math.ceil(worst / 8));
}
function dessinerPage(nom, v, valides, panneau) {
  page.textContent = ''; groupes = [];
  stage.style.setProperty('--n', v.n);
  const brut0 = TX.brut(nom), dc = decalageCols(brut0, v.p);
  const lignes = seg(brut0.map(([c, l, t]) => [c - dc, l, t]));
  if (panneau && lignes.length) {
    const bas = (Math.max(...lignes.map(l => l[1])) + 3) * 12;
    const p = document.createElement('div'); p.id = 'panneau';
    p.style.cssText = `left:calc(7*var(--cw));width:calc(62*var(--cw));top:0;height:calc(${Math.max(bas, 320)}*var(--cw)/8);background:${v.f};border-color:${v.b}`;
    page.appendChild(p);
  }
  let courant = null, prec = null, g = null;
  for (const [col, lig, segs] of lignes) {
    const plain = segs.map(s => s[1]).join('');
    const m = plain.match(/^\s*<\s*F(\d)\s*>/);
    if (m) { courant = +m[1]; g = { k: courant, els: [] }; groupes.push(g); }
    else if (courant !== null && (prec === null || lig !== prec + 1 || !plain.trim())) { courant = null; g = null; }
    const el = document.createElement('div'); el.className = 'ln';
    el.style.left = `calc(${col}*var(--cw))`; el.style.top = `calc(${lig}*var(--lh))`;
    el.style.color = v.n;
    for (const [dec, t, acc] of segs) {
      const sp = document.createElement(acc ? 'b' : 'span'); sp.textContent = t; if (acc) sp.style.color = v.a; el.appendChild(sp);
    }
    if (courant !== null && g) { g.els.push(el); el.dataset.k = courant; }
    page.appendChild(el); prec = lig;
  }
  groupes = groupes.filter(x => valides.includes(x.k));
  for (const gr of groupes) for (const el of gr.els) {
    el.classList.add('g');
    el.addEventListener('mouseenter', () => gr.els.forEach(e => e.classList.add('hot')));
    el.addEventListener('mouseleave', () => gr.els.forEach(e => e.classList.remove('hot')));
    el.addEventListener('click', ev => { ev.stopPropagation(); choisirK(gr.k); });
  }
  if (!lignes.length) return [0, 0];
  const lm = lignes.map(l => l[1]); return [Math.min(...lm), Math.max(...lm)];
}
function decalageInitial(prem, der) {
  const max = Math.max(0, page.offsetHeight - hViewport); return Math.max(0, Math.min((prem - 2) * lhPx, max));
}
function resumesChoix(nom) {
  const res = {}; let cur = null;
  for (const [, , segs] of seg(TX.brut(nom))) {
    const plain = segs.map(s => s[1]).join('').trim();
    const m = plain.match(/^<\s*F(\d)\s*>\s*(.*)/);
    if (m) { cur = +m[1]; res[cur] = m[2]; } else if (cur !== null && plain) res[cur] += ' ' + plain; else cur = null;
  }

}
function message(t) { $('msg').textContent = t || ''; }

  mode = 'intro'; const sc = IDX.TC1; fond(sc);

function afficher(msg) {

  }

/* ------------------------------------------------------ sauvegardes, triche */

   <div class="row"><label>${tr('vie')} <input id="chVieN" type="number" min="0" max="32" style="width:4.5em"></label><button id="chVie">${tr('vieMax')}</button><label>${tr('or')} <input id="chOr" type="number" min="0" max="99" style="width:4.5em"></label></div>
   <div>${tr('objs')}</div><div class="chk" id="chObj"></div><div class="row"><button id="chOk">OK</button><button id="chNo">${tr('close')}</button></div>`;
  const sel = dlg.querySelector('#chSc'); SC.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = LAB[i]; if (i === nv.sc) o.selected = true; sel.appendChild(o); });

  const co = dlg.querySelector('#chObj');

  dlg.querySelector('#chVie').onclick = () => { dlg.querySelector('#chVieN').value = VIE_MAX; };

    let W = 0; co.querySelectorAll('input').forEach(c => { if (c.checked) W |= 1 << c.dataset.b; }); nv.W = W >>> 0;

/* -------------------------------------------------------------- clavier */
const CHIFFRES = { '&': 1, 'é': 2, '"': 3, "'": 4, '(': 5, 'É': 2 };
document.addEventListener('keydown', ev => {
  if (dlg.open) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  Son.jouer(Son.demande ?? Son.liste ?? D.intro);          // premier geste : débloque l'audio
  const k = ev.key;
  if (mode === 'titre' || mode === 'fin') { if (k === 'Escape' || /^(Shift|Control|Alt|Meta|CapsLock|Tab)$/.test(k)) return; ev.preventDefault(); mode === 'fin' ? montrerTitreDepuisFin() : (introN = 0, suiteIntro()); return; }
  if (mode === 'intro') { if (k === 'Escape') sauterIntro(); else if (!/^(Shift|Control|Alt|Meta|CapsLock|Tab)$/.test(k)) { ev.preventDefault(); suiteIntro(); } return; }
  const fk = k.match(/^F([1-5])$/); let n = null;
  if (fk) n = +fk[1]; else if (/^[1-5]$/.test(k)) n = +k; else if (CHIFFRES[k]) n = CHIFFRES[k];
  if (n) { ev.preventDefault(); choisirK(n); return; }

  if (K === 'B') retour(); else if (K === 'S') dlgSlots('save'); else if (K === 'L') dlgSlots('load'); else if (K === 'T') dlgTriche();
  else if (K === 'M') dlgCarte(); else if (K === 'N') basculerSon(); else if (K === 'Q') quitter();

  else if (K === 'PageDown') { scroll.scrollTop += hViewport * .9; ev.preventDefault(); } else if (K === 'PageUp') { scroll.scrollTop -= hViewport * .9; ev.preventDefault(); }
  else if (K === 'Home') { scroll.scrollTop = 0; } else if (K === 'End') { scroll.scrollTop = 1e6; }
});
function dlgCarte() {

  let page = tem ? 2 : 1;

    let g = `<div class="map" style="grid-template-columns:repeat(${nc},1fr)">`;
    const at = {}; Z.forEach((z, i) => at[z.r * 10 + z.c] = [z, i + off]);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// séparateur déplaçable
(() => {

})();

appliquerZoomUI(); construireCmds(); textesUI(); mettreEchelle();
